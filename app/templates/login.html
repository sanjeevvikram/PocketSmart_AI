{% extends 'base.html' %}{% block content %}<section class="auth card"><h1>{{ 'Create account' if mode=='register' else 'Welcome back' }}</h1><form id="authForm"><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" minlength="8" required></label><button class="btn" type="submit">{{ 'Register' if mode=='register' else 'Login' }}</button></form><p id="message"></p><a href="{{ '/login' if mode=='register' else '/register' }}">{{ 'Already have an account? Login' if mode=='register' else 'Need an account? Register' }}</a></section>{% endblock %}{% block scripts %}<script>window.AUTH_MODE='{{ mode }}'</script>{% endblock %}
