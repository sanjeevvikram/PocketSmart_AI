{% extends 'base.html' %}{% block content %}<div class="dashboard"><header><div><span class="eyebrow">SMART PLANNERS</span><h1>Your PocketSmart workspace</h1></div><button class="btn secondary" id="logout">Logout</button></header><div class="tabs"><button class="tab active" data-tab="home">Home</button><button class="tab" data-tab="party">Party</button><button class="tab" data-tab="jewelry">Jewelry</button><button class="tab" data-tab="history">History</button></div><section id="home" class="panel active"><form id="homeForm" class="form-grid"><label>Budget (₹)<input name="budget" type="number" min="1" required></label><label>Style<input name="style" value="modern"></label><label class="wide">Rooms (comma separated)<input name="rooms" value="Living Room,Bedroom" required></label><label class="wide">Items (one per line: item,quantity)<textarea name="items">light,2
ceiling fan,1
dining table,1</textarea></label><label class="wide">Notes<textarea name="notes"></textarea></label><button class="btn" type="submit">Generate home plan</button></form></section><section id="party" class="panel"><form id="partyForm" class="form-grid"><label>Budget (₹)<input name="budget" type="number" min="1" required></label><label>Guests<input name="guests" type="number" min="1" required></label><label>Event type<input name="event_type" value="birthday" required></label><label>Venue<input name="venue" value="home"></label><label>Date<input name="date"></label><label class="wide">Preferences<textarea name="preferences"></textarea></label><button class="btn" type="submit">Generate party plan</button></form></section><section id="jewelry" class="panel"><form id="jewelryForm" class="form-grid" enctype="multipart/form-data"><label>Budget (₹)<input name="budget" type="number" min="1" required></label><label>Occasion<input name="occasion" value="wedding" required></label><label>Metal<select name="metal_preference"><option>any</option><option>gold</option><option>silver</option><option>rose gold</option></select></label><label>Style<input name="style" value="elegant"></label><label class="wide">Outfit description<textarea name="outfit_description"></textarea></label><label class="wide">Optional outfit image<input name="outfit_image" type="file" accept="image/*"></label><button class="btn" type="submit">Generate jewelry plan</button></form></section><section id="history" class="panel"><div id="historyList"></div></section><section id="results" class="results"></section></div>{% endblock %}{% block scripts %}<script src="/static/js/dashboard.js"></script>{% endblock %}
